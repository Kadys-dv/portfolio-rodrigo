name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Instalar navegador para testes end-to-end
        run: npx playwright install --with-deps chromium
      - name: Executar validações de código
        run: npm run check
      - name: Executar testes end-to-end
        run: npm run test:e2e
