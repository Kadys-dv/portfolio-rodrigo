name: Publicar portfólio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validar site
        run: npm test
      - name: Preparar arquivos públicos
        run: |
          mkdir _site
          cp index.html curriculo.html carta-apresentacao.html favicon.svg robots.txt sitemap.xml _site/
          cp -R assets certificados js projetos styles _site/
          touch _site/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
